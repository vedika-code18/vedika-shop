<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
header{background:#e91e63;color:#fff;padding:14px;text-align:center;position:sticky;top:0;z-index:10}
header h1{font-size:22px}header p{font-size:12px;opacity:.9}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px;background:#fff;position:sticky;top:62px;z-index:9}
.tabs button{white-space:nowrap;border:1px solid #e91e63;background:#fff;color:#e91e63;padding:8px 14px;border-radius:20px;cursor:pointer;font-weight:700}
.tabs button.active{background:#e91e63;color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px #0001}
.card img{width:100%;height:220px;object-fit:cover}
.card .in{padding:10px}.card h3{font-size:14px;line-height:1.3;min-height:36px}
.price{color:#e91e63;font-size:18px;font-weight:800;margin:6px 0}.price s{color:#999;font-size:13px}
.tag{font-size:11px;background:#fff3e0;padding:3px 7px;border-radius:10px;display:inline-block}
.star{font-size:12px;color:#ff9800}
.btn{width:100%;background:#e91e63;color:#fff;border:0;padding:10px;border-radius:8px;font-weight:800;margin-top:8px;cursor:pointer}
.btn2{width:100%;background:#25D366;color:#fff;border:0;padding:10px;border-radius:8px;font-weight:800;margin-top:6px;cursor:pointer}
.cartbar{position:fixed;bottom:0;left:0;right:0;background:#e91e63;color:#fff;padding:12px;text-align:center;font-weight:800;cursor:pointer}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head>
