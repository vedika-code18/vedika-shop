function filterCat(c,el){cur=c;document.querySelectorAll('.cats button').forEach(b=>b.classList.remove('active'));el.classList.add('active');render()}
function doSearch(q){query=q.toLowerCase();render()}
function addToCart(i){cart.push(products[i]);document.getElementById('cartCount').innerText=cart.length;document.getElementById('cartCount2').innerText=cart.length;alert('Cart me add ho gaya!')}
function buyNow(i){cart=[products[i]];document.getElementById('cartCount').innerText=1;document.getElementById('cartCount2').innerText=1;openCheckout()}
function openCheckout(){if(cart.length===0){alert('Pehle ADD TO CART karo!');return}let total=cart.reduce((s,p)=>s+p.price,0);let txt=cart.map(p=>`• ${p.name} - Rs.${p.price}`).join('<br>')+`<br><b>Total: Rs.${total}</b>`;document.getElementById('cartItems').innerHTML=txt;let upiLink=`upi://pay?pa=${MY_UPI}&pn=${MY_NAME}&am=${total}&cu=INR`;document.getElementById('qrImg').src=`https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(upiLink)}`;document.getElementById('checkoutModal').style.display='flex'}
function closeCheckout(){document.getElementById('checkoutModal').style.display='none'}
function payUPI(){let total=cart.reduce((s,p)=>s+p.price,0);window.location.href=`upi://pay?pa=${MY_UPI}&pn=${MY_NAME}&am=${total}&cu=INR&tn=Vedika Shop Order`}
function placeOrder(pay){let n=document.getElementById('cName').value;let ph=document.getElementById('cPhone').value;let a=document.getElementById('cAddr').value;let s=document.getElementById('cSize').value;if(!n||!ph||!a){alert('Naam, Mobile, Address bharo!');return}let total=cart.reduce((s,p)=>s+p.price,0);let items=cart.map(p=>`${p.name} - Rs.${p.price}`).join('%0A');let msg=`*NEW ORDER - Vedika Shop*%0A%0A${items}%0A%0ATotal: Rs.${total}%0APayment: ${pay}%0AColor/Size: ${s}%0A%0AName: ${n}%0AMobile: ${ph}%0AAddress: ${a}`;window.open(`https://wa.me/${MY_WHATSAPP}?text=${msg}`,'_blank')}
render();
</script>
