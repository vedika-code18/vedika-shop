<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#f5f5f5;padding-bottom:80px}
.top{background:white;padding:10px;position:sticky;top:0;z-index:10}
.logo{text-align:center;color:#f43397;font-weight:900;font-size:22px}
.logo small{display:block;font-size:11px;color:#666;font-weight:400}
.search{display:flex;gap:8px;align-items:center;margin-top:6px}
.search input{flex:1;padding:10px;border:1px solid #ddd;border-radius:20px;background:#f5f5f5}
.cats{display:flex;gap:8px;overflow-x:auto;padding:10px;background:white}
.cats button{white-space:nowrap;border:1px solid #eee;background:white;padding:8px 14px;border-radius:20px}
.cats button.active{background:#f43397;color:white}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
.card{background:white;border-radius:8px;overflow:hidden;position:relative}
.card img{width:100%;height:260px;object-fit:cover;background:#eee}
.info{padding:8px}.info h3{font-size:13px;color:#333;font-weight:400;height:34px;overflow:hidden}
.price{font-size:18px;font-weight:700}.old{font-size:12px;color:#999;text-decoration:line-through}
.off{font-size:11px;color:#0a7a42;background:#e6f7ee;padding:2px 5px;border-radius:4px}
.star{background:#008000;color:white;font-size:11px;padding:3px 7px;border-radius:12px}
.addbtn{width:100%;background:#f43397;color:white;border:none;padding:9px;border-radius:8px;font-weight:700;margin-top:7px}
.buybtn{width:100%;background:white;color:#f43397;border:1px solid #f43397;padding:8px;border-radius:8px;font-weight:700;margin-top:5px}
.heartbtn{position:absolute;top:8px;right:8px;background:white;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cartbar{position:fixed;bottom:0;left:0;right:0;background:#f43397;color:white;display:flex;justify-content:space-between;padding:14px 16px;font-weight:bold}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:30;align-items:center;justify-content:center;padding:15px}
.modal .box{background:white;width:100%;max-width:400px;border-radius:15px;padding:18px}
.modal input,.modal textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:10px}
.paybtn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:bold;margin-top:8px}
</style>
</head>
<body>

{name:"Trendy Fashionable Women Tshirt - Butterfly Black",cat:"wtshirt",price:199,old:499,img:"https://images.unsplash.com/photo-1529139574466-a303027c1d8b?w=600",colors:"Black, Pink",pattern:"Oversized Butterfly",rate:"4",cnt:"(2,199)"},

/* WOMEN FASHION */
{name:"Women Co-Ord Set - Pink",cat:"wfashion",price:449,old:899,img:"https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=600",colors:"Pink, Black",pattern:"Co-Ord",rate:"4.1",cnt:"(800)"},
{name:"Women Printed Kurti - Cotton",cat:"wfashion",price:399,old:799,img:"https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=600",colors:"Red, Blue, Green",pattern:"Kurti",rate:"4.2",cnt:"(1,200)"},
{name:"Women Jhumka - Gold",cat:"wfashion",price:179,old:399,img:"https://images.unsplash.com/photo-1573408301185-9146fe634ad0?w=600",colors:"Gold",pattern:"Jhumka",rate:"4.3",cnt:"(2,500)"},
/* MEN FASHION */
{name:"Men Shirt - Check Blue",cat:"mfashion",price:399,old:799,img:"https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=600",colors:"Blue, Black",pattern:"Check",rate:"4.1",cnt:"(800)"},
{name:"Men Shirt - Plain White",cat:"mfashion",price:349,old:699,img:"https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?w=600",colors:"White, Black",pattern:"Plain",rate:"4",cnt:"(600)"},
{name:"Men Denim Jacket",cat:"mfashion",price:599,old:1199,img:"https://images.unsplash.com/photo-1551028719-00167b16eac5?w=600",colors:"Blue, Black",pattern:"Denim",rate:"4.2",cnt:"(700)"},
/* MAKEUP MINI 199 */
{name:"Makeup Kit Mini - Full",cat:"makeup",price:199,old:399,img:"https://images.unsplash.com/photo-1596462502278-27bfdc403348?w=600",colors:"Pink, Nude",pattern:"Mini Kit",rate:"4.1",cnt:"(1,800)"},
{name:"Lipstick Set (5 pc)",cat:"makeup",price:299,old:599,img:"https://images.unsplash.com/photo-1586495777744-4413f21062fa?w=600",colors:"Red, Pink, Nude",pattern:"Lipstick",rate:"4.2",cnt:"(2,200)"},
];
let cart=[]; let cur='all'; let query='';
function render(){let g=document.getElementById('grid');g.innerHTML='';products.filter(p=>(cur==='all'||p.cat===cur)&&(query===''||p.name.toLowerCase().includes(query))).forEach(p=>{let off=Math.round((p.old-p.price)/p.old*100);g.innerHTML+=`<div class="card"><div class="heartbtn">♡</div><img src="${p.img}"><div class="info"><h3>${p.name}</h3><div style="font-size:11px;color:#666">🎨 ${p.colors} • ${p.pattern}</div><div><span class="price">₹${p.price}</span> <span class="old">${p.old}</span> <span class="off">${off}% off</span></div><div style="font-size:12px">₹${p.price-30} with Pay Later</div><div><span class="star">${p.rate} ★</span> <span style="font-size:11px;color:#888">${p.cnt}</span></div><button class="addbtn" onclick="addToCart(${products.indexOf(p)})">ADD TO CART</button><button class="buybtn" onclick="buyNow(${products.indexOf(p)})">BUY NOW</button></div></div>`})}
function filterCat(c,el){cur=c;document.querySelectorAll('.cats button').forEach(b=>b.classList.remove('active'));el.classList.add('active');render()}
function doSearch(q){query=q.toLowerCase();render()}
function addToCart(i){cart.push(products[i]);document.getElementById('cartCount').innerText=cart.length;alert('Cart me add ho gaya!')}
function buyNow(i){cart=[products[i]];document.getElementById('cartCount').innerText=1;openCheckout()}
function openCheckout(){if(cart.length===0){alert('Pehle ADD TO CART karo!');return}let total=cart.reduce((s,p)=>s+p.price,0);document.getElementById('cartItems').innerHTML=cart.map(p=>`• ${p.name} - Rs.${p.price}`).join('<br>')+`<br><b>Total: Rs.${total}</b>`;let upiLink=`upi://pay?pa=${MY_UPI}&pn=${MY_NAME}&am=${total}&cu=INR`;document.getElementById('qrImg').src=`https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(upiLink)}`;document.getElementById('checkoutModal').style.display='flex'}
function closeCheckout(){document.getElementById('checkoutModal').style.display='none'}
function payUPI(){let total=cart.reduce((s,p)=>s+p.price,0);window.location.href=`upi://pay?pa=${MY_UPI}&pn=${MY_NAME}&am=${total}&cu=INR&tn=Vedika Shop Order`}
function placeOrder(pay){let n=document.getElementById('cName').value;let ph=document.getElementById('cPhone').value;let a=document.getElementById('cAddr').value;let s=document.getElementById('cSize').value;if(!n||!ph||!a){alert('Naam, Mobile, Address bharo!');return}let total=cart.reduce((s,p)=>s+p.price,0);let items=cart.map(p=>`${p.name} - Rs.${p.price}`).join('%0A');let msg=`*NEW ORDER - Vedika Shop*%0A%0A${items}%0A%0ATotal: Rs.${total}%0APayment: ${pay}%0AColor/Size: ${s}%0A%0AName: ${n}%0AMobile: ${ph}%0AAddress: ${a}`;window.open(`https://wa.me/${MY_WHATSAPP}?text=${msg}`,'_blank')}
render();
