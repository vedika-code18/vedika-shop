<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vedika Shop</title>
<meta name="theme-color" content="#ff2e7e">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#fff0f5;padding-bottom:90px}
.header{background:#ff2e7e;color:white;padding:15px;text-align:center;position:sticky;top:0;z-index:10}
.offer{background:#fff3cd;color:#856404;padding:10px;text-align:center;font-size:13px;font-weight:bold}
.cats{display:flex;gap:8px;overflow-x:auto;padding:12px}
.cats button{white-space:nowrap;border:1px solid #ff2e7e;background:white;color:#ff2e7e;padding:8px 14px;border-radius:20px;font-weight:bold}
.cats button.active{background:#ff2e7e;color:white}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 12px}
.card{background:white;border-radius:15px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.card img{width:100%;height:150px;object-fit:cover}
.card .info{padding:10px}
.card h3{font-size:14px}.card .price{color:#ff2e7e;font-weight:bold;font-size:18px}.card .old{color:#888;text-decoration:line-through;font-size:12px}
.btn{width:100%;background:#ff2e7e;color:white;border:none;padding:9px;border-radius:10px;font-weight:bold;margin-top:6px}
.btn2{width:100%;background:white;color:#ff2e7e;border:1px solid #ff2e7e;padding:8px;border-radius:10px;font-weight:bold;margin-top:5px}
.cartbar{position:fixed;bottom:0;left:0;right:0;background:#ff2e7e;color:white;display:flex;justify-content:space-between;padding:14px 16px;font-weight:bold;z-index:20}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:30;align-items:center;justify-content:center;padding:15px}
.modal .box{background:white;width:100%;max-width:400px;border-radius:15px;padding:18px;max-height:90vh;overflow:auto}
.modal input,.modal textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:10px}
.paybtn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:bold;margin-top:8px;font-size:15px}
</style>
</head>
<body>
<div class="header"><h1>💖 Vedika Shop 💖</h1><p>Meesho Jaisa Sasta • Nagpur • COD + PhonePe</p></div>
<div class="offer">🔥 NEW COLLECTION 🔥 2 Saman lo, 50 Rs OFF!</div>
<div class="cats"><button class="active" onclick="filterCat('all',this)">All</button><button onclick="filterCat('dress',this)">👗 Fashion</button><button onclick="filterCat('sadi',this)">🥻 Sadi</button><button onclick="filterCat('makeup',this)">💄 Makeup</button><button onclick="filterCat('watch',this)">⌚ Watch</button><button onclick="filterCat('earbuds',this)">🎧 Earbuds</button><button onclick="filterCat('cover',this)">📱 Cover</button></div>
<div class="grid" id="grid"></div>
<div class="cartbar" onclick="openCheckout()"><span>🛒 Cart: <span id="cartCount">0</span></span><span>View Cart & Order →</span></div>

<div class="modal" id="checkoutModal"><div class="box">
<h2 style="text-align:center;color:#ff2e7e">🛒 Order</h2>
<p id="cartItems" style="font-size:13px;background:#fff0f5;padding:10px;border-radius:10px"></p>
<input id="cName" placeholder="Tumhara Naam *">
<input id="cPhone" placeholder="Mobile Number *">
<textarea id="cAddr" placeholder="Poora Address *"></textarea>

<!-- PHONEPE - LAPTOP PE BHI DIKHEGA -->
<div style="background:#f3e8ff;padding:12px;border-radius:12px;margin:8px 0;text-align:center;border:2px solid #5f259f">
<p style="font-weight:bold;color:#5f259f">💜 PHONEPE / GPAY SE PAY KARO</p>
<p style="font-size:13px;margin:5px 0">UPI ID: <b>9975039791@ybl</b></p>
<img id="qrImg" src="" style="width:150px;height:150px;background:white;padding:5px;border-radius:10px">
<p style="font-size:11px;margin:5px 0">👆 Laptop hai toh is QR ko Phone se Scan karo<br>Phone hai toh neeche Button dabao</p>
<button class="paybtn" style="background:#5f259f;color:white" onclick="payUPI()">📱 PhonePe App Kholo - Pay Karo</button>
<button class="paybtn" style="background:white;color:#5f259f;border:1px solid #5f259f" onclick="copyUPI()">📋 UPI ID Copy Karo</button>
</div>

<button class="paybtn" style="background:#25D366;color:white" onclick="placeOrder('PhonePe')">✅ PhonePe se Pay Kiya, Order Confirm Karo</button>
<button class="paybtn" style="background:#ff9800;color:white" onclick="placeOrder('COD')">💵 COD - Cash Dunga</button>
<button class="paybtn" style="background:#eee" onclick="closeCheckout()">Band Karo</button>
</div></div>

<script>
let MY_WHATSAPP="919975039791"; let MY_UPI="9975039791@ybl"; let MY_NAME="Vedika";
const products=[
{name:"Co-Ord Set",cat:"dress",price:449,old:899,img:"https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=400"},
{name:"Printed Kurti",cat:"dress",price:399,old:799,img:"https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=400"},
{name:"Crop Top",cat:"dress",price:299,old:599,img:"https://images.unsplash.com/photo-1572804013309-59a88b7e92f1?w=400"},
{name:"Daily Wear Sadi",cat:"sadi",price:499,old:999,img:"https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=400"},
{name:"Fancy Sadi",cat:"sadi",price:499,old:999,img:"https://images.unsplash.com/photo-1617627143750-d86bc21e42bb?w=400"},
{name:"Lipstick Set",cat:"makeup",price:299,old:599,img:"https://images.unsplash.com/photo-1586495777744-4413f21062fa?w=400"},
{name:"Makeup Kit",cat:"makeup",price:399,old:799,img:"https://images.unsplash.com/photo-1596462502278-27bfdc403348?w=400"},
{name:"Girls Watch",cat:"watch",price:399,old:899,img:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400"},
{name:"Wireless Earbuds",cat:"earbuds",price:449,old:999,img:"https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=400"},
{name:"Cute Phone Cover",cat:"cover",price:149,old:299,img:"https://images.unsplash.com/photo-1601593346740-925612772716?w=400"},
];
let cart=[];
function render(f='all'){let g=document.getElementById('grid');g.innerHTML='';products.filter(p=>f==='all'||p.cat===f).forEach(p=>{g.innerHTML+=`<div class="card"><img src="${p.img}"><div class="info"><h3>${p.name}</h3><div><span class="old">Rs.${p.old}</span> <span class="price">Rs.${p.price}</span></div><button class="btn" onclick="addToCart(${products.indexOf(p)})">ADD TO CART</button><button class="btn2" onclick="buyNow(${products.indexOf(p)})">BUY NOW</button></div></div>`})}
function filterCat(c,el){document.querySelectorAll('.cats button').forEach(b=>b.classList.remove('active'));el.classList.add('active');render(c)}
function addToCart(i){cart.push(products[i]);document.getElementById('cartCount').innerText=cart.length;alert('Cart me add ho gaya!')}
function buyNow(i){cart=[products[i]];document.getElementById('cartCount').innerText=1;openCheckout()}
function openCheckout(){if(cart.length===0){alert('Pehle ADD TO CART karo!');return}let total=cart.reduce((s,p)=>s+p.price,0);let txt=cart.map(p=>`• ${p.name} - Rs.${p.price}`).join('<br>')+`<br><b>Total: Rs.${total}</b>`;document.getElementById('cartItems').innerHTML=txt;let upiLink=`upi://pay?pa=${MY_UPI}&pn=${MY_NAME}&am=${total}&cu=INR`;document.getElementById('qrImg').src=`https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(upiLink)}`;document.getElementById('checkoutModal').style.display='flex'}
function closeCheckout(){document.getElementById('checkoutModal').style.display='none'}
function payUPI(){let total=cart.reduce((s,p)=>s+p.price,0);window.location.href=`upi://pay?pa=${MY_UPI}&pn=${MY_NAME}&am=${total}&cu=INR&tn=Vedika Shop Order`;alert('Agar Phone hai toh PhonePe khulega! Laptop hai toh QR Scan karo!')}
function copyUPI(){navigator.clipboard.writeText(MY_UPI);alert('UPI Copy ho gaya: '+MY_UPI)}
function placeOrder(pay){let n=document.getElementById('cName').value;let ph=document.getElementById('cPhone').value;let a=document.getElementById('cAddr').value;if(!n||!ph||!a){alert('Naam, Mobile, Address bharo!');return}let total=cart.reduce((s,p)=>s+p.price,0);let items=cart.map(p=>`${p.name} - Rs.${p.price}`).join('%0A');let msg=`*NEW ORDER - Vedika Shop*%0A%0A${items}%0A%0ATotal: Rs.${total}%0APayment: ${pay}%0A%0AName: ${n}%0AMobile: ${ph}%0AAddress: ${a}`;window.open(`https://wa.me/${MY_WHATSAPP}?text=${msg}`,'_blank')}
render();
</script>
</body>
</html>
