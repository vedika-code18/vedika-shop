<!DOCTYPE html>
<html>
<head>
<title>Login - Vedika Shop</title>
<style>
body { font-family: Arial; background: #f2f2f2; display: flex; justify-content: center; padding-top: 60px; }
.box { background: white; padding: 30px; width: 300px; border-radius: 10px; box-shadow: 0 2px 10px #ccc; text-align: center; }
input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
button { background: #ff9900; border: none; padding: 12px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 16px; }
a { color: #0066cc; text-decoration: none; font-size: 14px; }
</style>
</head>
<body>

<div class="box">
<h2>🛒 Vedika Shop</h2>
<h3>Sign In</h3>
<input type="email" id="email" placeholder="Email ya Mobile Number">
<input type="password" id="pass" placeholder="Password">
<button onclick="login()">Login</button>
<br><br>
<a href="vedika-shop.html">Back to Shop</a>
<p id="msg"></p>
</div>

<script>
function login() {
  let e = document.getElementById("email").value;
  let p = document.getElementById("pass").value;
  if(e == "" || p == "") {
    document.getElementById("msg").innerText = "Please Email aur Password dalo!";
    document.getElementById("msg").style.color = "red";
  } else {
    document.getElementById("msg").innerText = "Welcome Back, Vedika! Login Successful ❤️";
    document.getElementById("msg").style.color = "green";
  }
}
</script>

</body>
</html>
